services:
  - type: web
    name: reco-handwriting-portal
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    disk:
      name: reco-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: OCR_DEVICE
        value: cpu
      - key: OCR_DB_PATH
        value: /var/data/app.db
      - key: OCR_UPLOAD_DIR
        value: /var/data/uploads
