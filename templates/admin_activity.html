<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d0f" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Review administrator sign-ins and portal operations." />
    <title>Admin Activity | Handwriting Recognition Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <div class="backdrop"></div>
    <main class="shell">
      <header class="panel top-nav app-header">
        <div class="brand-lockup">
          <a href="/" class="brand-mark" aria-label="Reco admin home">R</a>
          <div class="page-heading">
            <p class="kicker">Administration</p>
            <h1>Activity</h1>
          </div>
        </div>
        <div class="user-strip">
          <div class="user-meta">
            <p id="user-name" class="user-name">User</p>
            <p id="user-role" class="user-role">role</p>
          </div>
          <nav class="primary-nav" aria-label="Admin navigation">
            <a href="/" class="btn ghost nav-link-btn">Overview</a>
            <a href="/history" class="btn ghost nav-link-btn">History</a>
            <a href="/admin/uploads" class="btn ghost nav-link-btn">Uploads</a>
          </nav>
          <button
            id="profile-toggle"
            type="button"
            class="btn ghost profile-toggle"
            aria-expanded="false"
            aria-label="Profile options"
          >
            <img id="profile-toggle-avatar" class="profile-toggle-avatar" alt="Profile" />
          </button>
          <div id="profile-menu" class="profile-menu hidden" role="dialog" aria-label="User profile">
            <div class="profile-avatar-wrap">
              <img id="profile-avatar-preview" class="profile-avatar" alt="Profile image" />
              <label for="profile-avatar-input" class="btn ghost profile-avatar-btn">Upload Image</label>
              <input
                id="profile-avatar-input"
                class="visually-hidden"
                type="file"
                accept=".png,.jpg,.jpeg,.webp,image/png,image/jpeg,image/webp"
              />
            </div>
            <div class="profile-row">
              <span class="profile-label">Name</span>
              <span id="profile-name" class="profile-value">-</span>
            </div>
            <div class="profile-row">
              <span class="profile-label">Email</span>
              <span id="profile-email" class="profile-value">-</span>
            </div>
            <div class="profile-row">
              <span class="profile-label">Role</span>
              <span id="profile-role" class="profile-value">-</span>
            </div>
            <button id="profile-logout-btn" type="button" class="btn primary profile-logout">Logout</button>
          </div>
        </div>
      </header>

      <section class="panel history-panel history-page-panel">
        <div class="section-head">
          <div>
            <p class="kicker">Audit trail</p>
            <h2>Administrator activity</h2>
            <p class="section-description">A read-only record of sign-ins and administrative changes.</p>
          </div>
          <button id="refresh-activity" type="button" class="btn ghost">Refresh</button>
        </div>
        <div class="history-filter-toolbar">
          <label class="filter-field filter-search">
            <span>Search activity</span>
            <input id="activity-search-input" type="search" placeholder="Admin, operation, or target" />
          </label>
          <label class="filter-field">
            <span>Operation</span>
            <select id="activity-action-filter">
              <option value="all" selected>All operations</option>
            </select>
          </label>
          <button id="activity-filter-clear" type="button" class="btn ghost">Clear</button>
          <p id="activity-count" class="history-filter-count">0 records</p>
        </div>
        <div id="activity-status" class="status" aria-live="polite"></div>
        <div class="table-wrap">
          <table class="data-table admin-activity-table">
            <thead>
              <tr>
                <th>Time</th>
                <th>Admin</th>
                <th>Operation</th>
                <th>Target</th>
                <th>Details</th>
                <th>IP</th>
              </tr>
            </thead>
            <tbody id="activity-body"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="{{ url_for('static', filename='admin_activity.js') }}"></script>
  </body>
</html>
