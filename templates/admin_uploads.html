<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d0f" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Review handwriting uploads across portal users." />
    <title>Admin Uploads | Handwriting Recognition Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <div class="backdrop"></div>
    <main class="shell">
      <a class="skip-link" href="#main-content">Skip to content</a>
      <header class="panel top-nav app-header">
        <div class="brand-lockup">
          <a href="/" class="brand-mark" aria-label="Reco admin home">R</a>
          <div class="page-heading">
            <p class="kicker">Administration</p>
            <h1>Uploads</h1>
          </div>
        </div>
        <div class="user-strip">
          <div class="user-meta">
            <p id="user-name" class="user-name">User</p>
            <p id="user-role" class="user-role">role</p>
          </div>
          <nav class="primary-nav" aria-label="Admin navigation">
            <a href="/" class="btn ghost nav-link-btn">Overview</a>
            <a href="/history" class="btn ghost nav-link-btn">History</a>
            <a href="/admin/activity-report" class="btn ghost nav-link-btn">Activity</a>
          </nav>
          <button
            id="profile-toggle"
            type="button"
            class="btn ghost profile-toggle"
            aria-expanded="false"
            aria-label="Profile options"
            popovertarget="profile-menu"
          >
            <img id="profile-toggle-avatar" class="profile-toggle-avatar" alt="Profile" />
          </button>
          <div id="profile-menu" class="profile-menu hidden" role="dialog" aria-label="User profile" popover="auto" tabindex="-1">
            <div class="profile-avatar-wrap">
              <img id="profile-avatar-preview" class="profile-avatar" alt="Profile image" />
              <label for="profile-avatar-input" class="btn ghost profile-avatar-btn">Upload Image</label>
              <input
                id="profile-avatar-input"
                class="visually-hidden"
                type="file"
                accept=".png,.jpg,.jpeg,.webp,image/png,image/jpeg,image/webp"
              />
            </div>
            <div class="profile-row">
              <span class="profile-label">Name</span>
              <span id="profile-name" class="profile-value">-</span>
            </div>
            <div class="profile-row">
              <span class="profile-label">Email</span>
              <span id="profile-email" class="profile-value">-</span>
            </div>
            <div class="profile-row">
              <span class="profile-label">Role</span>
              <span id="profile-role" class="profile-value">-</span>
            </div>
            <button id="profile-logout-btn" type="button" class="btn primary profile-logout">Logout</button>
          </div>
        </div>
      </header>

      <section id="main-content" class="panel history-panel history-page-panel" tabindex="-1">
        <div class="section-head">
          <div>
            <p class="kicker">Portal media</p>
            <h2>All uploads</h2>
            <p class="section-description">Monitor recently processed files across user accounts.</p>
          </div>
          <button id="refresh-uploads" type="button" class="btn ghost">Refresh</button>
        </div>
        <div id="uploads-status" class="status" aria-live="polite"></div>
        <div class="table-wrap" tabindex="0" aria-label="Uploads table. Scroll horizontally to view every column.">
          <table class="data-table">
            <caption class="visually-hidden">Portal uploads</caption>
            <thead>
              <tr>
                <th scope="col">User</th>
                <th scope="col">File</th>
                <th scope="col">Confidence</th>
                <th scope="col">Source</th>
                <th scope="col">Time</th>
              </tr>
            </thead>
            <tbody id="uploads-body"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="{{ url_for('static', filename='admin_uploads.js') }}"></script>
  </body>
</html>
